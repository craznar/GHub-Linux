[workspace]
resolver = "2"
members = ["crates/llc-core", "crates/llc-protocol", "crates/llc-input", "crates/llc-service", "crates/llc-cli", "crates/llc-session-agent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
authors = ["Christopher Burke"]
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["serde", "v4"] }
thiserror = "2.0"
schemars = { version = "1.0", features = ["uuid1"] }
fs2 = "0.4"
libc = "0.2"
zbus = { version = "5.12", default-features = false, features = ["blocking-api", "async-io"] }
llc-core = { path = "crates/llc-core" }
llc-protocol = { path = "crates/llc-protocol" }
llc-input = { path = "crates/llc-input" }
llc-service = { path = "crates/llc-service" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

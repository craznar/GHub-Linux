<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="linux-logitech-control">
    <allow own="au.craznar.LinuxLogitechControl1"/>
  </policy>
  <policy context="default">
    <deny own="au.craznar.LinuxLogitechControl1"/>
    <allow send_destination="au.craznar.LinuxLogitechControl1"/>
  </policy>
</busconfig>
